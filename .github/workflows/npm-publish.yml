name: Publish TypeScript Client

on:
  push:
    tags:
      - 'ts-v*'

permissions:
  contents: read

jobs:
  build-typescript-client:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.19'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: clients/typescript/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies
        run: npm ci
        working-directory: clients/typescript

      - name: Verify package version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#ts-v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Version mismatch: package.json=$PKG_VERSION tag=$TAG_VERSION"
            exit 1
          fi
        working-directory: clients/typescript

      - name: Verify proto sync
        run: npm run check:proto-sync
        working-directory: clients/typescript

      - name: Typecheck
        run: npm run typecheck
        working-directory: clients/typescript

      - name: Test
        run: npm test
        working-directory: clients/typescript

      - name: Build
        run: npm run build
        working-directory: clients/typescript

      - name: Inspect package contents
        run: npm pack --dry-run --json
        working-directory: clients/typescript

      - name: Pack package artifact
        run: npm pack --json
        working-directory: clients/typescript

      - name: Upload package artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: typescript-client-package
          path: clients/typescript/*.tgz
          if-no-files-found: error

  publish-typescript-client:
    needs: build-typescript-client
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20.19'
          registry-url: 'https://registry.npmjs.org'

      - name: Download package artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: typescript-client-package

      - name: Publish to npm
        run: npm publish ./*.tgz --access public --provenance --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
